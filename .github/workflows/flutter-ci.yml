name: Flutter CI (Week 13)

# GitHub only executes workflows from the repository-root .github/workflows/.
# The codelab file lives at
#   13-week-13-ci-cd-automation/.github/workflows/flutter-ci.yml
# as the assignment layout requires; this root copy is the one GitHub actually
# runs, pointed at the Week 13 project via working-directory.
on:
  push:
    branches: [main]
    paths:
      - "13-week-13-ci-cd-automation/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "13-week-13-ci-cd-automation/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-week-13-ci-cd-automation
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pin the exact version the project was verified against so CI is
          # reproducible. `channel: stable` can move to a newer SDK whose
          # analyzer surfaces new `info` diagnostics, which `--fatal-infos`
          # would then fail on.
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            13-week-13-ci-cd-automation/build/app/outputs/flutter-apk/app-release.apk
            13-week-13-ci-cd-automation/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
